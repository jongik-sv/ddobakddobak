name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages 가 같은 run 의 github-pages 아티팩트 메타데이터를 Actions API 로 조회한다(없으면 "Fetching artifact metadata failed").
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # docs/ 안 심볼릭 링크(PRD.md 등)가 upload-pages-artifact의 tar를 깨뜨림
      # → 링크를 실파일로 해소한 사본을 업로드
      - run: cp -RL docs _site
      # 사용자 매뉴얼(Astro Starlight) 빌드 → _site/manual/ 로 복사.
      # docs/manual/ddobak-api-guide.html 은 위 cp 로 이미 _site/manual/ 에 있으므로 덮어쓰지 않고 합친다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: |
          mkdir -p _site/manual
          cp -R site/dist/. _site/manual/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
