name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 업로드와 배포를 같은 job 에서 하면 deploy-pages 가 방금 올린 아티팩트를 "Found 0 artifact(s)" 로 못 찾는다(2026-11 실측).
  # → GitHub 권장 구성대로 build(업로드) / deploy(needs: build) 두 job 으로 나눈다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/ 안 심볼릭 링크(PRD.md 등)가 upload-pages-artifact의 tar를 깨뜨림
      # → 링크를 실파일로 해소한 사본을 업로드
      - run: cp -RL docs _site
      # 사용자 매뉴얼(Astro Starlight) 빌드 → _site/manual/ 로 복사.
      # docs/manual/ddobak-api-guide.html 은 위 cp 로 이미 _site/manual/ 에 있으므로 덮어쓰지 않고 합친다.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: |
          mkdir -p _site/manual
          cp -R site/dist/. _site/manual/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
